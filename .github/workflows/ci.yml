name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  api-tests:
    name: Build and Test API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t evently-api:ci .

      - name: Start API container
        run: |
          docker run -d \
            --name evently-ci \
            -p 127.0.0.1:5000:5000 \
            -e JWT_SECRET_KEY="ci-local-test-secret" \
            evently-api:ci

      - name: Wait for healthy API
        run: |
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/api/health | grep -q '"status"[[:space:]]*:[[:space:]]*"healthy"'; then
              echo "API is healthy"
              exit 0
            fi

            echo "Waiting for API... ($attempt/30)"
            sleep 2
          done

          echo "API health check failed"
          docker logs evently-ci
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run API tests
        env:
          API_BASE_URL: http://127.0.0.1:5000
        run: python -m pytest tests/ -v

      - name: Show container logs on failure
        if: failure()
        run: docker logs evently-ci || true

      - name: Clean up container
        if: always()
        run: docker rm -f evently-ci || true

  deploy:
    name: Deploy to Production
    needs: api-tests

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/evently-api:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/evently-api:${{ github.sha }}

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          IMAGE_URL: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/evently-api:${{ github.sha }}
        run: |
          curl --fail --silent --show-error --get \
            --data-urlencode "imgURL=${IMAGE_URL}" \
            "${RENDER_DEPLOY_HOOK}"

      - name: Smoke test production API
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "RENDER_URL is not configured"
            exit 1
          fi

          echo "Waiting for Render deployment..."
          sleep 60

          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 15 "${RENDER_URL%/}/api/health" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"healthy"'; then
              echo "Production API is healthy"
              exit 0
            fi

            echo "Waiting for healthy production API... ($attempt/30)"
            sleep 5
          done

          echo "Production smoke test failed"
          exit 1
